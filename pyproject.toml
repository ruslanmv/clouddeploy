[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clouddeploy"
version = "0.1.2"
description = "CloudDeploy: enterprise terminal + AI workspace and MCP server."
readme = "README.md"
# Loosened slightly to ensure 3.11 is definitely accepted
requires-python = ">=3.11,<3.13" 
license = { file = "LICENSE" }
authors = [{ name = "Ruslan Magana Vsevolodovna" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
]

dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.1.0",
  "pydantic>=2.7.0",
  "crewai[anthropic]>=0.76.9",
  "anthropic>=0.39.0",
  "crewai-tools>=0.13.4",
  "ibm-watsonx-ai>=1.1.0",
  "langchain-ibm>=0.3.0",
  "rich>=13.0.0",
  "pyjwt[crypto]>=2.8.0",
  "litellm>=1.80.5",
  "python-hcl2>=7.3.1",
  "jsonschema>=4.18.0",
  "networkx>=3.0.0",
  "python-multipart>=0.0.7",  
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "twine>=5.0",
  "build>=1.2.1",
]

[project.scripts]
clouddeploy = "clouddeploy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clouddeploy*"]

[tool.setuptools.package-data]
clouddeploy = ["web/*", "web/**/*", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"